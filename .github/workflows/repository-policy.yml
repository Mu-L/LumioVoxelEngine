name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification
        run: |
          node .spec/tools/spec-lint.mjs
          node --test .spec/tools/spec-lint.test.mjs
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## 公共契约来源$' README.md
          grep -q '^## Source / Compile-Time Dependencies$' README.md
          grep -q '^## Headless Test Surface$' README.md
          grep -q '^## 子模块' README.md
          grep -q '^## 当前阶段与开发节奏$' README.md
      - name: Validate legacy contract symbols stay out of live code (ADR 0014)
        run: |
          # ADR 0014:退出旧合同制后不留兼容层、不留兜底常量。旧符号一旦写回活代码就红。
          # pathspec 必须是 'crates/*/src/*'——git pathspec 的 * 跨 /,写成 'crates/*/src'
          # 会要求路径以 src 结尾,恒零命中,是一道空转门。
          if [ "$(git grep -l 'fn ' -- 'crates/*/src/*' | wc -l)" -eq 0 ]; then
            echo "::error::pathspec 匹配不到任何源文件,这道门是空转的" >&2
            exit 1
          fi
          # SCHEMA_EPOCH 带词边界:裁决 3 允许本仓自持的 SNAPSHOT_SCHEMA_EPOCH。
          set +e
          git grep -n \
            -e 'Generated[A-Z]' \
            -e 'BASELINE_ID' \
            -e '\bSCHEMA_EPOCH' \
            -e 'STABLE_ERROR_IDS' \
            -e 'is_stable_error_id' \
            -e 'P0_DECISION_GATES' \
            -e 'from_generated' \
            -- 'crates/*/src/*'
          status=$?
          set -e
          case "$status" in
            0) echo "::error::旧合同制符号回流到 crates/*/src/**(见上方命中行)" >&2; exit 1 ;;
            1) echo "no legacy contract symbols under crates/*/src/**" ;;
            *) echo "::error::git grep exited with $status" >&2; exit "$status" ;;
          esac

  cargo:
    name: Cargo workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Workspace metadata and DAG
        run: |
          cargo metadata --format-version 1 --no-deps
          cargo run -p lumio-voxel-test-support --example check-crate-dag
      - name: fmt clippy check tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo check --workspace --no-default-features
          cargo test --workspace --all-features
